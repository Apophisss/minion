name = "office"
title = "Office"
icon = "📄"
extends = "browser"
description = "LibreOffice Writer, Calc and Impress, a text editor and a file manager, plus Firefox. Saves .docx/.xlsx/.pptx by default and never shows tips, donation bars or recovery dialogs."
memory = "3g"
shm = "1g"
packages = [
  "libreoffice-writer",
  "libreoffice-calc",
  "libreoffice-impress",
  "libreoffice-gtk3",
  "fonts-crosextra-carlito",
  "fonts-crosextra-caladea",
  "mousepad",
  "pcmanfm",
  "poppler-utils",
  # Python can write documents directly too (a script is often the fastest way to a spreadsheet or a report).
  "python3-openpyxl",
  "python3-docx",
  # python-pptx's own needs (it isn't packaged in Debian: its wheel is installed below)
  "python3-lxml",
  "python3-pil",
  "python3-xlsxwriter",
  "python3-typing-extensions",
]
# python-pptx 1.0.2, pure Python, checked against its SHA-256: presentations, like documents and spreadsheets.
setup = [
  "python3 -c \"import hashlib, io, urllib.request, zipfile; url = 'https://files.pythonhosted.org/packages/d9/4f/00be2196329ebbff56ce564aa94efb0fbc828d00de250b1980de1a34ab49/python_pptx-1.0.2-py3-none-any.whl'; data = urllib.request.urlopen(url).read(); assert hashlib.sha256(data).hexdigest() == '160838e0b8565a8b1f67947675886e9fea18aa5e795db7ae531606d68e785cba', 'python-pptx wheel checksum'; zipfile.ZipFile(io.BytesIO(data)).extractall('/usr/lib/python3/dist-packages')\" && python3 -c 'import pptx'",
]
env = { SAL_USE_VCLPLUGIN = "gtk3" }
apps = [
  { name = "Writer", id = "writer", command = "libreoffice --writer" },
  { name = "Calc", id = "calc", command = "libreoffice --calc" },
  { name = "Impress", id = "impress", command = "libreoffice --impress" },
  { name = "Text Editor", id = "editor", command = "mousepad" },
  { name = "Files", id = "files", command = "pcmanfm" },
]
tips = """
Launch apps with `open writer`, `open calc`, `open impress`, or open a file: `open ~/Documents/report.docx`.
Documents save as .docx/.xlsx/.pptx by default. Move files in and out with `files` (or `minion cp`).
Menus: `menu File > Export As > Export as PDF...` (see --menus lists every command and its shortcut); in a Save/Open
dialog, `path ~/Documents/report.docx` types the full path. Read any document as text with `files read` (xlsx gives
values and formulas) and convert with `files convert` (e.g. docx to pdf, xlsx to csv), even while LibreOffice is open.
Keys: ctrl+s save, ctrl+shift+s save as, ctrl+1/2/3 heading styles, ctrl+b/i/u. In Calc, act "type value\\tvalue\\n" fills a row
(Tab moves right, Return goes to the next row); `see` lists visible cells row by row (row 2: @14 A2 North · @15 B2 120); use `script` for many rows.
Typing is exact: AutoCorrect, smart quotes and AutoInput are off.
"""

[files]
# The file manager lists files as a table, which accessibility reads exactly (its icon view exposes no names).
"/etc/xdg/pcmanfm/default/pcmanfm.conf" = '''
[ui]
view_mode=list
show_hidden=0
'''
"/usr/lib/libreoffice/share/registry/minion.xcd" = '''<?xml version="1.0" encoding="UTF-8"?>
<oor:data xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:oor="http://openoffice.org/2001/registry">
  <dependency file="main"/>
  <dependency file="writer"/>
  <dependency file="calc"/>
  <dependency file="impress"/>
  <oor:component-data oor:name="Common" oor:package="org.openoffice.Office">
    <node oor:name="Misc">
      <prop oor:name="ShowTipOfTheDay" oor:op="fuse"><value>false</value></prop>
      <prop oor:name="FirstRun" oor:op="fuse"><value>false</value></prop>
    </node>
    <node oor:name="Save">
      <node oor:name="Document">
        <prop oor:name="WarnAlienFormat" oor:op="fuse"><value>false</value></prop>
      </node>
    </node>
    <!-- Type exactly what the agent sends: no smart quotes, dashes, capitalization or replacements. -->
    <node oor:name="AutoCorrect">
      <prop oor:name="UseReplacementTable" oor:op="fuse"><value>false</value></prop>
      <prop oor:name="TwoCapitalsAtStart" oor:op="fuse"><value>false</value></prop>
      <prop oor:name="CapitalAtStartSentence" oor:op="fuse"><value>false</value></prop>
      <prop oor:name="ChangeUnderlineWeight" oor:op="fuse"><value>false</value></prop>
      <prop oor:name="ChangeOrdinalNumber" oor:op="fuse"><value>false</value></prop>
      <prop oor:name="ChangeDash" oor:op="fuse"><value>false</value></prop>
      <prop oor:name="AddNonBreakingSpace" oor:op="fuse"><value>false</value></prop>
      <prop oor:name="ReplaceSingleQuote" oor:op="fuse"><value>false</value></prop>
      <prop oor:name="ReplaceDoubleQuote" oor:op="fuse"><value>false</value></prop>
    </node>
  </oor:component-data>
  <!-- Centimeters in every dialog, whatever the locale: "20 cm" typed into an inch field is stored rounded
       (7.87" is 19.99 cm), while inches typed into a centimeter field ("1 in") come out exact (2.54 cm). -->
  <oor:component-data oor:name="Writer" oor:package="org.openoffice.Office">
    <node oor:name="Layout">
      <node oor:name="Other">
        <prop oor:name="MeasureUnit" oor:op="fuse"><value>2</value></prop>
      </node>
    </node>
    <node oor:name="AutoFunction">
      <node oor:name="Format">
        <node oor:name="ByInput">
          <prop oor:name="Enable" oor:op="fuse"><value>false</value></prop>
        </node>
      </node>
    </node>
  </oor:component-data>
  <oor:component-data oor:name="Calc" oor:package="org.openoffice.Office">
    <node oor:name="Layout">
      <node oor:name="Other">
        <node oor:name="MeasureUnit">
          <prop oor:name="Metric" oor:op="fuse"><value>2</value></prop>
          <prop oor:name="NonMetric" oor:op="fuse"><value>2</value></prop>
        </node>
      </node>
    </node>
    <node oor:name="Input">
      <!-- No AutoInput: typing "Co" in a column that has "Coffee" must not become "Coffee". -->
      <prop oor:name="AutoInput" oor:op="fuse"><value>false</value></prop>
    </node>
  </oor:component-data>
  <oor:component-data oor:name="Impress" oor:package="org.openoffice.Office">
    <node oor:name="Layout">
      <node oor:name="Other">
        <node oor:name="MeasureUnit">
          <prop oor:name="Metric" oor:op="fuse"><value>2</value></prop>
          <prop oor:name="NonMetric" oor:op="fuse"><value>2</value></prop>
        </node>
      </node>
    </node>
    <node oor:name="Misc">
      <node oor:name="NewDoc">
        <prop oor:name="AutoPilot" oor:op="fuse"><value>false</value></prop>
      </node>
    </node>
  </oor:component-data>
  <oor:component-data oor:name="Recovery" oor:package="org.openoffice.Office">
    <node oor:name="RecoveryInfo">
      <prop oor:name="Enabled" oor:op="fuse"><value>false</value></prop>
    </node>
  </oor:component-data>
  <oor:component-data oor:name="Setup" oor:package="org.openoffice">
    <node oor:name="Product">
      <prop oor:name="ooSetupLastVersion" oor:op="fuse"><value>25.2</value></prop>
      <prop oor:name="LastTimeGetInvolvedShown" oor:op="fuse"><value>4102444800</value></prop>
      <prop oor:name="LastTimeDonateShown" oor:op="fuse"><value>4102444800</value></prop>
    </node>
    <node oor:name="Office">
      <node oor:name="Factories">
        <node oor:name="com.sun.star.text.TextDocument" oor:op="fuse">
          <prop oor:name="ooSetupFactoryDefaultFilter" oor:op="fuse"><value>MS Word 2007 XML</value></prop>
        </node>
        <node oor:name="com.sun.star.sheet.SpreadsheetDocument" oor:op="fuse">
          <prop oor:name="ooSetupFactoryDefaultFilter" oor:op="fuse"><value>Calc MS Excel 2007 XML</value></prop>
        </node>
        <node oor:name="com.sun.star.presentation.PresentationDocument" oor:op="fuse">
          <prop oor:name="ooSetupFactoryDefaultFilter" oor:op="fuse"><value>Impress MS PowerPoint 2007 XML</value></prop>
        </node>
      </node>
    </node>
  </oor:component-data>
</oor:data>
'''
