<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pay invoice INV-2207</title>
<link rel="stylesheet" href="gym.css"><script src="gym.js"></script></head><body>
<h1>Pay invoice INV-2207</h1><p>Amount due: <b>$318.40</b></p>
<iframe id="pay" title="Secure payment" style="width:100%;height:330px;border:1px solid #cbd5e1;border-radius:8px" srcdoc='
<!doctype html><html><head><link rel="stylesheet" href="gym.css"></head><body style="margin:12px">
<h2>Secure card payment</h2>
<label>Name on card <input id="n"></label><label>Card number <input id="c" inputmode="numeric" placeholder="1234 5678 9012 3456"></label>
<label>Expiry (MM/YY) <input id="e" size="6"></label><label>CVC <input id="v" size="4"></label>
<button id="p">Pay $318.40</button><p id="msg"></p>
<script>
document.getElementById("p").onclick = () => {
  const c = document.getElementById("c").value.replace(/\s/g, ""), e = document.getElementById("e").value, v = document.getElementById("v").value;
  if (c.length !== 16 || !/^\d\d\/\d\d$/.test(e) || !/^\d{3}$/.test(v)) { document.getElementById("msg").textContent = "Check the card details."; return; }
  document.getElementById("msg").textContent = "Payment approved.";
  parent.report("iframe", {name: document.getElementById("n").value, last4: c.slice(-4), expiry: e}, "Invoice INV-2207 paid. Receipt R-99120.");
};
</script></body></html>'></iframe>
<div id="result"></div></body></html>
