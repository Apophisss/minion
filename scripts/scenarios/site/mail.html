<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Inbox - Acme Mail</title>
<link rel="stylesheet" href="gym.css"><script src="gym.js"></script>
<style>body{max-width:1100px}.app{display:flex;gap:14px}.side{width:150px}.list{width:380px;border-right:1px solid #cbd5e1}.msg{flex:1}
.it{padding:8px;border-bottom:1px solid #e2e8f0;cursor:pointer}.it.unread{font-weight:bold}.it:hover{background:#f1f5f9}</style></head><body>
<h1>Acme Mail</h1><p><input id="q" placeholder="Search mail" size="40"> <button id="compose">Compose</button></p>
<div class="app"><div class="side"><p><a href="#" id="fi">Inbox</a></p><p><a href="#" id="fs">Sent</a></p><p><a href="#" id="fa">Archive</a></p></div>
<div class="list" id="list" role="list" aria-label="Messages"></div><div class="msg" id="msg"><p class="muted">Select a message to read it.</p></div></div>
<div id="result"></div>
<script>
const M = [{"id": 1, "from": "Noa Levi", "email": "noa@studio.example", "subject": "Lunch on Thursday?", "body": "Hi! Are we still on for lunch on Thursday at 13:00? The new place near the office.", "att": null, "date": "Oct 15", "read": false}, {"id": 2, "from": "Harbor Bank", "email": "alerts@harborbank.example", "subject": "Your statement is ready", "body": "Your September statement is ready to view in online banking.", "att": null, "date": "Oct 15", "read": false}, {"id": 3, "from": "Dana Peretz", "email": "dana.peretz@acme.example", "subject": "Q3 figures for review", "body": "Hi,\n\nAttached are the Q3 figures by region. Could you send me the total amount across all rows before Friday?\n\nThanks,\nDana", "att": "q3-figures.csv", "date": "Oct 14", "read": false}, {"id": 4, "from": "GitHub", "email": "noreply@github.example", "subject": "[minion] New issue #42", "body": "A new issue was opened: 'Support for Wayland sessions'.", "att": null, "date": "Oct 14", "read": false}, {"id": 5, "from": "Dana Peretz", "email": "dana.peretz@acme.example", "subject": "Re: offsite agenda", "body": "Looks good to me. Let's keep the afternoon free for workshops.", "att": null, "date": "Oct 13", "read": true}, {"id": 6, "from": "Travel Desk", "email": "travel@acme.example", "subject": "Your flight to Berlin", "body": "Your booking LH 687 on 3 Nov is confirmed. Seat 14C.", "att": null, "date": "Oct 13", "read": true}, {"id": 7, "from": "Omer Katz", "email": "omer@acme.example", "subject": "Invoice #5521 overdue", "body": "Hi, invoice #5521 ($2,340) is now 10 days overdue. Can you check?", "att": "invoice-5521.txt", "date": "Oct 12", "read": true}, {"id": 8, "from": "Newsletter", "email": "news@weekly.example", "subject": "This week in design", "body": "Ten articles about typography, color and motion.", "att": null, "date": "Oct 12", "read": true}, {"id": 9, "from": "HR", "email": "hr@acme.example", "subject": "Open enrollment ends Friday", "body": "Please choose your health plan by Friday.", "att": null, "date": "Oct 11", "read": true}, {"id": 10, "from": "Maya Biton", "email": "maya@acme.example", "subject": "Q3 figures (draft, ignore)", "body": "Old draft, please ignore. Dana will send the final numbers.", "att": "q3-draft.csv", "date": "Oct 11", "read": true}, {"id": 11, "from": "IT Support", "email": "it@acme.example", "subject": "Password expires in 3 days", "body": "Your password expires in 3 days. Change it in the portal.", "att": null, "date": "Oct 10", "read": true}, {"id": 12, "from": "Lior Shapiro", "email": "lior@acme.example", "subject": "Photos from the offsite", "body": "Shared album link inside. Great day!", "att": null, "date": "Oct 10", "read": true}]; let folder = "Inbox", q = ""; const sent = [], archived = new Set();
const $ = id => document.getElementById(id);
function list() { let ms = folder === "Sent" ? sent : M.filter(m => (folder === "Archive") === archived.has(m.id));
  if (q) ms = ms.filter(m => (m.from + " " + m.subject + " " + m.body).toLowerCase().includes(q));
  $("list").innerHTML = ms.map(m => `<div class="it ${m.read === false ? "unread" : ""}" role="listitem" data-id="${m.id || ""}">${m.from || "To: " + m.to}<br>${m.subject} <span class="muted">${m.date || ""}</span></div>`).join("") || '<p class="muted">No messages.</p>';
  $("list").querySelectorAll(".it").forEach(d => d.onclick = () => d.dataset.id && open(Number(d.dataset.id))); }
function open(id) { const m = M.find(x => x.id === id); m.read = true; list();
  $("msg").innerHTML = `<h2>${m.subject}</h2><p><b>${m.from}</b> &lt;${m.email}&gt; <span class="muted">${m.date}</span></p><p style="white-space:pre-wrap">${m.body}</p>` +
    (m.att ? `<p>Attachment: <a href="files/${m.att}" download>${m.att}</a></p>` : "") + `<p><button id="rep">Reply</button> <button class="secondary" id="arc">Archive</button></p>`;
  $("rep").onclick = () => compose(m.email, "Re: " + m.subject); $("arc").onclick = () => { archived.add(id); list(); $("msg").innerHTML = '<p class="muted">Archived.</p>'; report("mail-archive", {id: id, subject: m.subject}); }; }
function compose(to, subj) { $("msg").innerHTML = `<h2>New message</h2><label>To <input id="to" size="40" value="${to || ""}"></label><label>Subject <input id="su" size="40" value="${subj || ""}"></label>
  <label>Message <textarea id="bo" rows="8" cols="50"></textarea></label><p><button id="send">Send</button></p>`;
  $("send").onclick = () => { const s = {to: $("to").value, subject: $("su").value, body: $("bo").value}; sent.push(s); $("msg").innerHTML = '<p>Message sent.</p>'; report("mail-send", s, "Message sent to " + s.to + "."); }; }
$("compose").onclick = () => compose(); $("q").oninput = e => { q = e.target.value.toLowerCase(); list(); };
$("fi").onclick = e => { e.preventDefault(); folder = "Inbox"; list(); }; $("fs").onclick = e => { e.preventDefault(); folder = "Sent"; list(); }; $("fa").onclick = e => { e.preventDefault(); folder = "Archive"; list(); };
list();
</script></body></html>
