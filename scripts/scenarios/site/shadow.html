<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Smart home</title>
<link rel="stylesheet" href="gym.css"><script src="gym.js"></script></head><body>
<h1>Smart home</h1><p>Living room devices</p>
<device-card name="Ceiling light"></device-card><device-card name="Air conditioner"></device-card><device-card name="Blinds"></device-card>
<div id="result"></div>
<script>
const on = {};
customElements.define("device-card", class extends HTMLElement {
  connectedCallback() {
    const r = this.attachShadow({mode: "closed"}), n = this.getAttribute("name");
    r.innerHTML = `<style>div{border:1px solid #cbd5e1;border-radius:8px;padding:10px;margin:8px 0;font-family:sans-serif}
      button{background:#4f46e5;color:#fff;border:0;border-radius:6px;padding:6px 12px}</style>
      <div><b>${n}</b> <span>Off</span> <button>Turn on</button> <label>Level <input type="number" min="0" max="100" value="0" style="width:60px"></label></div>`;
    const b = r.querySelector("button"), s = r.querySelector("span"), lv = r.querySelector("input");
    b.onclick = () => { const v = s.textContent === "Off"; s.textContent = v ? "On" : "Off"; b.textContent = v ? "Turn off" : "Turn on"; on[n] = {on: v, level: lv.value}; report("shadow", on); };
    lv.onchange = () => { on[n] = {on: s.textContent === "On", level: lv.value}; report("shadow", on); };
  }
});
</script></body></html>
