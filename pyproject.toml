[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minion-desktop"
dynamic = ["version"]
description = "Instant, featherweight Linux desktops for AI agents: office, dev, research and browser profiles, controlled through MCP, a CLI, Python or HTTP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Minion contributors" }]
keywords = [
  "ai-agents", "computer-use", "mcp", "model-context-protocol", "desktop", "virtual-desktop",
  "automation", "claude", "llm", "docker", "xvfb", "rpa", "browser-automation", "accessibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Topic :: Desktop Environment",
]
dependencies = []  # zero dependencies: the host side is pure standard library

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]  # Pillow: to test the in-desktop agent code

[project.scripts]
minion = "minion.cli:entry"
minion-desktop = "minion.cli:entry"

[project.urls]
Homepage = "https://github.com/apophisss/minion"
Documentation = "https://github.com/apophisss/minion/tree/main/docs"
Issues = "https://github.com/apophisss/minion/issues"
Changelog = "https://github.com/apophisss/minion/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "minion.agent.VERSION" }

[tool.setuptools.packages.find]
include = ["minion*"]

[tool.setuptools.package-data]
minion = ["profiles/*.toml", "images/*", "web/*", "skill/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "x11: needs Xvfb and the desktop tools on this machine (local backend)",
  "docker: needs a reachable Docker daemon",
  "slow: builds images or starts browsers",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
